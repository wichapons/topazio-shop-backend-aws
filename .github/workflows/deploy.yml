name: Deploy Backend to EKS

on:
  push:
    branches:
      - main

# Permission needed for OIDC token exchange
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials with OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      run: |
        aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
        docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    - name: Build, Tag, and Push Docker Image to ECR
      id: build-and-push-ecr
      run: |
        # Variables
        IMAGE_REPO_NAME=backend
        RANDOM_TAG=${{ secrets.IMAGE_TAG_PREFIX }}-$(date +%Y%m%d%H%M%S)   # Generate unique tag using timestamp
        ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
        REGION=${{ secrets.AWS_REGION }}
        ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com

        echo "Generated Image Tag: ${RANDOM_TAG}"
        echo "RANDOM_TAG=${RANDOM_TAG}" >> $GITHUB_ENV  # Export for the next job

        # Check if Dockerfile exists
        if [ ! -f Dockerfile ]; then
          echo "Error: Dockerfile not found in the current directory"
          ls -la
          exit 1
        fi

        # Build Docker image
        docker build -t ${IMAGE_REPO_NAME}:${RANDOM_TAG} .

        # Tag the image for ECR
        docker tag ${IMAGE_REPO_NAME}:${RANDOM_TAG} ${ECR_REGISTRY}/${IMAGE_REPO_NAME}:${RANDOM_TAG}        # Push the image to ECR
        docker push ${ECR_REGISTRY}/${IMAGE_REPO_NAME}:${RANDOM_TAG}

  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Configure AWS credentials with OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Update kube config
      run: |
        aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}

    - name: Deploy to Kubernetes
      run: |
        # Set environment variables for use in manifests
        IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/backend:${{ env.RANDOM_TAG }}"
        
        # Create namespace first
        kubectl apply -f kubernetes/namespace.yaml
        
        # Create secrets directly from GitHub repository secrets
        kubectl create secret generic topazio-backend-secrets \
          --from-literal=MONGO_URI="${{ secrets.MONGO_URI }}" \
          --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
          --from-literal=STRIPE_API_KEY="${{ secrets.STRIPE_API_KEY }}" \
          --from-literal=LAUNCHDARKLY_SDK_KEY="${{ secrets.LAUNCHDARKLY_SDK_KEY }}" \
          --namespace=topazio-dev \
          --dry-run=client -o yaml | kubectl apply -f -
          
        # Apply ConfigMap for non-sensitive configuration
        kubectl apply -f kubernetes/configmap.yaml
        
        # Deploy application manifests
        envsubst < kubernetes/deployment.yaml | kubectl apply -f -
        kubectl apply -f kubernetes/service.yaml
        kubectl apply -f kubernetes/ingress.yaml
        
        # Wait for deployment to complete
        kubectl rollout status deployment/topazio-backend -n topazio-dev --timeout=180s
        
        # Wait for deployment to complete
        kubectl rollout status deployment/topazio-backend -n topazio-dev --timeout=180s
