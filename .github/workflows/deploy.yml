name: Deploy Backend to EKS

on:
  push:
    branches:
      - main

# Permission needed for OIDC token exchange
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.build-and-push-ecr.outputs.image-uri }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials with OIDC
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      run: |
        aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
        docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    - name: Build, Tag, and Push Docker Image to ECR
      id: build-and-push-ecr
      run: |
        # Variables
        IMAGE_REPO_NAME=backend
        RANDOM_TAG=${{ secrets.IMAGE_TAG_PREFIX }}-$(date +%Y%m%d%H%M%S)
        ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
        REGION=${{ secrets.AWS_REGION }}
        ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com

        echo "Generated Image Tag: ${RANDOM_TAG}"

        # Check if Dockerfile exists
        if [ ! -f Dockerfile ]; then
          echo "Error: Dockerfile not found in the current directory"
          ls -la
          exit 1
        fi

        # Build Docker image
        docker build -t ${IMAGE_REPO_NAME}:${RANDOM_TAG} .

        # Tag the image for ECR
        docker tag ${IMAGE_REPO_NAME}:${RANDOM_TAG} ${ECR_REGISTRY}/${IMAGE_REPO_NAME}:${RANDOM_TAG}
          # Push the image to ECR
        docker push ${ECR_REGISTRY}/${IMAGE_REPO_NAME}:${RANDOM_TAG}
        
        # Output the image URI for the next job
        echo "image-uri=${ECR_REGISTRY}/${IMAGE_REPO_NAME}:${RANDOM_TAG}" >> $GITHUB_OUTPUT
        echo "Debug: Set output image-uri=${ECR_REGISTRY}/${IMAGE_REPO_NAME}:${RANDOM_TAG}"

  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Configure AWS credentials with OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        role-session-name: GitHub-Actions-EKS-Deploy
        aws-region: ${{ secrets.AWS_REGION }}
        mask-aws-account-id: false

    - name: Verify AWS credentials
      run: |
        echo "Verifying AWS credentials..."
        aws sts get-caller-identity
        aws eks describe-cluster --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }} --query 'cluster.status'

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Update kube config and verify connection
      run: |
        echo "Updating kubeconfig..."
        aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }} --verbose
              
        echo "Testing cluster connection..."
        kubectl cluster-info
        kubectl get nodes
    - name: Deploy to Kubernetes
      env:
        IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
      run: |
        echo "IMAGE_URI environment variable: '${IMAGE_URI}'"
        
        # Verify IMAGE_URI is not empty
        if [ -z "${IMAGE_URI}" ]; then
          echo "Error: IMAGE_URI is empty!"
          echo "This usually means the build-and-push job failed to output the image-uri"
          exit 1
        fi
        
        echo "Deploying image: ${IMAGE_URI}"
        
        # Create namespace first
        kubectl apply -f kubernetes/namespace.yaml
        
        # Delete existing secret if it exists and create new one
        kubectl delete secret topazio-backend-secrets -n topazio-dev --ignore-not-found=true
        kubectl create secret generic topazio-backend-secrets \
          --from-literal=MONGO_URI="${{ secrets.MONGO_URI }}" \
          --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
          --from-literal=STRIPE_API_KEY="${{ secrets.STRIPE_API_KEY }}" \
          --from-literal=LAUNCHDARKLY_SDK_KEY="${{ secrets.LAUNCHDARKLY_SDK_KEY }}" \
          --namespace=topazio-dev
          
        # Apply ConfigMap for non-sensitive configuration
        kubectl apply -f kubernetes/configmap.yaml
        
        # Deploy application manifests with environment substitution
        export IMAGE_URI="${IMAGE_URI}"
        envsubst < kubernetes/deployment.yaml | kubectl apply -f -
        kubectl apply -f kubernetes/service.yaml
        kubectl apply -f kubernetes/ingress.yaml
        
        # Check deployment status
        kubectl get pods -n topazio-dev
        kubectl get services -n topazio-dev
        
        # Wait for deployment to complete
        kubectl rollout status deployment/topazio-backend -n topazio-dev --timeout=300s
